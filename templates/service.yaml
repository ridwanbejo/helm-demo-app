apiVersion: v1
kind: Service
metadata:
  name: "{{ .Values.appName }}-service"
  {{- with .Values.podLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.podAnnotations }}
  annotations:
    application/manager: "helm"
    {{- toYaml . | nindent 4 }}
  {{- end }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  {{- with .Values.podLabels }}
  selector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
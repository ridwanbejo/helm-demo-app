apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Values.appName }}-test-connection"
  {{- with .Values.podLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ .Values.appName }}-service:{{ .Values.service.port }}']
  restartPolicy: Never
